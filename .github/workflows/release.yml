name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # A tag push does not create a Release object, and the upload action waits
  # for one — so make it first, and attach the installers to it.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "Giverny $GITHUB_REF_NAME" \
              --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md).

          ## Install

          Linux / macOS:
          \`\`\`sh
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | sh
          \`\`\`

          Windows:
          \`\`\`powershell
          irm https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.ps1 | iex
          \`\`\`

          Binaries are unsigned; on macOS you may need \`xattr -d com.apple.quarantine\`."
          fi
          # The installers must live on the release itself — that is the URL
          # the one-line install command fetches.
          gh release upload "$GITHUB_REF_NAME" \
            scripts/install.sh scripts/install.ps1 --clobber

  upload-binaries:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: System deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: giverny
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
