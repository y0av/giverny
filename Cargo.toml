[workspace]
resolver = "2"
members = ["crates/app", "crates/term", "crates/core", "crates/claude"]

[workspace.package]
version = "0.5.3"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
giverny-term = { path = "crates/term" }
giverny-core = { path = "crates/core" }
giverny-claude = { path = "crates/claude" }

# terminal engine
alacritty_terminal = "0.26"
vte = "0.15"
polling = "3"

# ui
eframe = { version = "0.35", features = ["wgpu", "x11", "wayland"] }
egui = "0.35"

# text
swash = "0.2"
fontdb = "0.23"

# plumbing
crossbeam-channel = "0.5"
parking_lot = "0.12"
smallvec = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
dirs = "6"
jiff = "0.2"

# system
sysinfo = "0.39"
notify = "8"

# Wayland drag-and-drop. A Wayland client gets one wl_data_device, and this
# crate — which eframe uses for the clipboard — is the one that owns ours, so
# drops have to be taught there. See vendor/smithay-clipboard/README.md.
[patch.crates-io]
smithay-clipboard = { path = "vendor/smithay-clipboard" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
