[package]
name = "giverny"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A native GPU terminal built around Claude Code"

[[bin]]
name = "giverny"
path = "src/main.rs"

[dependencies]
giverny-term.workspace = true
giverny-core.workspace = true
giverny-claude.workspace = true
giverny-codex.workspace = true
sysinfo.workspace = true
eframe.workspace = true
egui.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
notify-rust = "4.18.0"
jiff.workspace = true
crossbeam-channel.workspace = true
serde_json.workspace = true
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
serde = { workspace = true, features = ["derive"] }
# The window handle: Wayland drag-and-drop needs it, so does the taskbar badge.
raw-window-handle = "0.6"
# Blocks on wgpu's adapter request before the window exists (`pick_renderer`).
# The version eframe already uses, so no new tree.
pollster = "0.4"
# Pasting a screenshot (src/paste_image.rs): the clipboard's image through
# the crate and feature eframe's clipboard already uses, the PNG it is
# written as, and the Windows clipboard's PNG arriving base64 from WSL. All
# versions already in the tree, so no new one.
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
tempfile = "3"
png = "0.18"
base64 = "0.22"

# Wayland drag-and-drop, which winit 0.30 does not implement. It arrives
# through the clipboard crate eframe already uses — patched in the workspace
# root; see src/wayland_dnd.rs.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android"))))'.dependencies]
smithay-clipboard = "0.7.3"
# WSLg's GPU path is an OpenGL driver picked by name (src/wslg.rs); a child
# process tries it on a windowless EGL context first. The version and feature
# wgpu's GL backend already uses, so no new tree.
khronos-egl = { version = "6", features = ["dynamic"] }
# Sizing WSLg's cursors to the display (src/wslg_cursor.rs), through the
# libX11/libXcursor winit already loads. The version winit uses, so no new
# tree.
x11-dl = "2.21"

# Shutting down on a signal, so a logout or a `kill` gets the same
# scrollback-and-state write that closing the window does.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.4"
# Signalling what a stopped tab left running; the version the workspace
# already uses.
libc = "0.2.189"

[build-dependencies]
# Puts the icon inside the .exe, where Explorer and the taskbar look for it.
winresource = "0.1"

# The dock badge: the Mac equivalent of the taskbar overlay below. Same
# versions winit already pulls in, so this adds no new tree.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDockTile"] }
objc2-foundation = "0.3"

[target.'cfg(windows)'.dependencies]
# Only to tell a console we were given from a console we were launched from.
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
# The taskbar overlay icon, which is COM and so needs the interfaces.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
