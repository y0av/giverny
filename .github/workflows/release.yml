name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # A tag push does not create a Release object, and the upload action waits
  # for one — so make it first, and attach the installers to it.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Born a pre-release, so `/releases/latest` — what the installers
            # and the in-app update check both ask for — keeps pointing at the
            # last complete release until every binary here has uploaded. A
            # release that is "latest" while a platform's zip is still building
            # is a 404 for whoever updates in that window, and a build that
            # fails leaves it a 404 for good.
            gh release create "$GITHUB_REF_NAME" \
              --prerelease \
              --title "Giverny $GITHUB_REF_NAME" \
              --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md).

          ## Install

          Linux / macOS:
          \`\`\`sh
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | sh
          \`\`\`

          Windows:
          \`\`\`powershell
          irm https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.ps1 | iex
          \`\`\`

          Binaries are unsigned; on macOS you may need \`xattr -d com.apple.quarantine\`."
          fi
          # The installers must live on the release itself — that is the URL
          # the one-line install command fetches.
          gh release upload "$GITHUB_REF_NAME" \
            scripts/install.sh scripts/install.ps1 --clobber

  upload-binaries:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Native arm64 runner rather than cross-compiling: the GPU/windowing
          # stack (wgpu, X11, Wayland) wants real arm64 system libraries.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: System deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: giverny
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # Only now is it a release anyone should be sent to.
  publish:
    needs: upload-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Check every binary is there, then make it latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job, so `gh` has no repository to infer from a
          # git remote — it has to be told which one it is talking about.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          expected="giverny-x86_64-unknown-linux-gnu.tar.gz
          giverny-aarch64-unknown-linux-gnu.tar.gz
          giverny-aarch64-apple-darwin.tar.gz
          giverny-x86_64-apple-darwin.tar.gz
          giverny-x86_64-pc-windows-msvc.zip
          install.sh
          install.ps1"
          have=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          missing=0
          for asset in $expected; do
            if ! grep -qx "$asset" <<<"$have"; then
              echo "missing: $asset"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "leaving $GITHUB_REF_NAME as a pre-release"
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" --prerelease=false --latest
